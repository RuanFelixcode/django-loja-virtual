{% extends 'projeto_web_app/base.html' %}

{% load static %}

{% load crispy_forms_tags %}

{% block content %}

<form method="post" action="" style="color: white;">
    {% csrf_token %}
    <div style="width: 75%; margin: auto;">

        <!-- Bloco para exibir as mensagens de erro ou alerta -->
        {% if messages %}
            {% for mensagem in messages %}
                <span class="alert alert-{{ mensagem.tags }}">{{ mensagem }}</span>
            {% endfor %}
            <br><br><br>
        {% endif %}

        {{ form|crispy }}
        <button type="submit" class="btn btn-success">Login</button>
    </div>
</form>

{% endblock %}
